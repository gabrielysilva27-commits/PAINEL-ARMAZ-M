name: Build Agente Puxada Portatil

on:
  push:
    branches: [main]
    paths:
      - "agent-puxada/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download IE Driver for Edge IE mode
        shell: pwsh
        run: |
          $url = "https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.14.0/IEDriverServer_Win32_4.14.0.zip"
          $zip = Join-Path $env:RUNNER_TEMP "iedriver.zip"
          $out = Join-Path $env:RUNNER_TEMP "iedriver"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          if (-not (Test-Path "$out\IEDriverServer.exe")) { throw "IEDriverServer.exe nao encontrado no pacote oficial." }

      - name: Publish portable launcher
        shell: pwsh
        run: |
          dotnet publish agent-puxada/portable/Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\launcher"

      - name: Build Edge IE window probe
        shell: pwsh
        run: |
          npm exec --yes --package=node-gyp -- node-gyp rebuild --directory agent-puxada/native
          if (-not (Test-Path 'agent-puxada/native/build/Release/existing_edge.node')) { throw 'Sonda de janelas ausente.' }
          node -e "const r=require('./agent-puxada/native/build/Release/existing_edge.node').probe(); if (!Number.isInteger(r.promaxSurfaces)) process.exit(1)"

      - name: Assemble portable package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist\AgentePuxada"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\runtime" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\app\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\driver" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\data" | Out-Null

          Copy-Item "$env:RUNNER_TEMP\launcher\AgentePuxada.exe" "$dist\AgentePuxada.exe"
          Copy-Item (Get-Command node).Source "$dist\runtime\node.exe"
          Copy-Item "agent-puxada\agent.js" "$dist\app\agent.js"
          Copy-Item "agent-puxada\update-runner.js" "$dist\app\update-runner.js"
          Copy-Item "agent-puxada\config.example.json" "$dist\app\config.example.json"
          Copy-Item "agent-puxada\package.json" "$dist\app\package.json"
          Copy-Item "agent-puxada\lib\*" "$dist\app\lib\" -Recurse
          Copy-Item "agent-puxada\native\build\Release\existing_edge.node" "$dist\app\lib\existing_edge.node"
          Copy-Item "$env:RUNNER_TEMP\iedriver\IEDriverServer.exe" "$dist\driver\IEDriverServer.exe"
          Copy-Item "agent-puxada\portable\README-PORTATIL.txt" "$dist\LEIA-ME.txt"

      - name: Assemble update package
        shell: pwsh
        run: |
          $upd = Join-Path $PWD "dist\AtualizacaoAgentePuxadaV2"
          New-Item -ItemType Directory -Force -Path "$upd\app\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$upd\driver" | Out-Null
          Copy-Item "agent-puxada\agent.js" "$upd\app\agent.js"
          Copy-Item "agent-puxada\update-runner.js" "$upd\app\update-runner.js"
          Copy-Item "agent-puxada\config.example.json" "$upd\app\config.example.json"
          Copy-Item "agent-puxada\package.json" "$upd\app\package.json"
          Copy-Item "agent-puxada\lib\*" "$upd\app\lib\" -Recurse
          Copy-Item "agent-puxada\native\build\Release\existing_edge.node" "$upd\app\lib\existing_edge.node"
          Copy-Item "$env:RUNNER_TEMP\iedriver\IEDriverServer.exe" "$upd\driver\IEDriverServer.exe"
          Set-Content "$upd\LEIA-ME-ATUALIZACAO.txt" @"
          AGENTE PUXADA V3 · AUTO-UPDATE
          Extraia por cima da pasta atual do AgentePuxada.
          Nao apague a pasta data: o token protegido permanece no computador.
          A V3 usa Microsoft Edge em modo IE pelo IEDriver oficial, nao usa Playwright/depuracao remota e inclui atualizacao automatica com validacao SHA-256 e rollback.
          "@

      - name: Verify package
        shell: pwsh
        run: |
          $base = Join-Path $PWD "dist\AgentePuxada"
          $required = @(
            "$base\AgentePuxada.exe",
            "$base\runtime\node.exe",
            "$base\app\agent.js",
            "$base\app\update-runner.js",
            "$base\app\lib\promax.js",
            "$base\app\lib\existing_edge.node",
            "$base\app\lib\csv020501.js",
            "$base\driver\IEDriverServer.exe"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Arquivo ausente: $p" }
          }

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check agent-puxada/agent.js
          node --check agent-puxada/update-runner.js
          node --check agent-puxada/lib/update.js
          node --check agent-puxada/lib/promax.js
          node --check agent-puxada/lib/csv020501.js
          node agent-puxada/test/session.test.js

      - name: Create ZIPs
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\AgentePuxada\*" -DestinationPath "AgentePuxada-Portatil-Windows-x64-v3.2.57.zip" -CompressionLevel Optimal
          Compress-Archive -Path "dist\AtualizacaoAgentePuxadaV2\*" -DestinationPath "AgentePuxada-Atualizacao-v3.2.57.zip" -CompressionLevel Optimal

      - name: Create SHA-256 release manifest
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist/AgentePuxada"
          # O driver continua no instalador completo; inclua-o no manifesto apenas ao mudar sua versão.
          # Substituir IEDriverServer.exe encerra a sessão IE existente e exige novo login no Promax.
          $files = @(Get-ChildItem "$root/app" -File -Recurse)
          New-Item -ItemType Directory -Force -Path "dist/release-assets" | Out-Null
          $entries = foreach ($file in $files) {
            $target = $file.FullName.Substring($root.Length + 1).Replace('\','/')
            $asset = $target.Replace('/','__')
            Copy-Item $file.FullName "dist/release-assets/$asset"
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/agent-puxada-v3.2.57/$asset"
            @{ target = $target; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); url = $url }
          }
          @{ version = '3.2.57'; commit_sha = $env:GITHUB_SHA; min_updater_version = '2'; capabilities = @('020501_SYNC','PROMAX_IE_MODE','PROMAX_DIRECT_CONTROL_PROBE','PROMAX_CALIBRATION_LOCK','PROMAX_CSV_AUTHENTICATED_CAPTURE','PROMAX_EXCEL_COM_CAPTURE','AUTO_UPDATE_V2','RELEASE_SHA256','UPDATE_ROLLBACK','FUTURE_JOBS_V1'); files = @($entries) } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'AgentePuxada-release-manifest-v3.2.57.json'

      - name: Publish installable release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "agent-puxada-v3.2.57"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --target $env:GITHUB_SHA --title "Agente Puxada 3.2.57" --notes "Instalador portátil ADM/PUXADA com atualizador SHA-256 e rollback. Cada computador usa seu próprio token."
          }
          $assets = @(Get-ChildItem 'dist/release-assets' -File | ForEach-Object { $_.FullName })
          gh release upload $tag "AgentePuxada-Portatil-Windows-x64-v3.2.57.zip" "AgentePuxada-Atualizacao-v3.2.57.zip" "AgentePuxada-release-manifest-v3.2.57.json" @assets --clobber

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentePuxada-Portatil-Windows-x64-v3.2.57
          path: AgentePuxada-Portatil-Windows-x64-v3.2.57.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload update artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentePuxada-Atualizacao-v3.2.57
          path: AgentePuxada-Atualizacao-v3.2.57.zip
          if-no-files-found: error
          retention-days: 7
