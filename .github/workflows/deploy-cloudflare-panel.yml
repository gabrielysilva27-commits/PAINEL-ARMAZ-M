name: Deploy Painel Armazem to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.mjs"
      - "*.css"
      - "assets/**"
      - ".github/workflows/deploy-cloudflare-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel-armaz-m-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ALT: ${{ secrets.CF_ACCOUNT_ID }}
      CF_LEGACY_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_LEGACY_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_PRIMARY:-${CF_TOKEN_ALT:-}}"
          ACCOUNT="${CF_ACCOUNT_PRIMARY:-${CF_ACCOUNT_ALT:-}}"

          if [ -n "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "auth_mode=api_token" >> "$GITHUB_OUTPUT"
          elif [ -n "${CF_LEGACY_KEY:-}" ] && [ -n "${CF_LEGACY_EMAIL:-}" ]; then
            echo "CLOUDFLARE_API_KEY=$CF_LEGACY_KEY" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_EMAIL=$CF_LEGACY_EMAIL" >> "$GITHUB_ENV"
            echo "auth_mode=legacy_key" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Cloudflare credential was found in GitHub Secrets. Expected CLOUDFLARE_API_TOKEN or CF_API_TOKEN (preferred), or CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL."
            exit 1
          fi

          if [ -n "$ACCOUNT" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          fi

      - name: Prepare public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-public
          rsync -a ./ .deploy-public/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.deploy-public/' \
            --exclude 'backend/' \
            --exclude 'agent-puxada/' \
            --exclude 'tests/' \
            --exclude '.env*' \
            --exclude '*.md' \
            --exclude '*.py' \
            --exclude '*.ps1' \
            --exclude '*.bat'

          cat > wrangler.deploy.jsonc <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "painel-armaz-m",
            "compatibility_date": "2026-11-09",
            "assets": {
              "directory": "./.deploy-public",
              "not_found_handling": "single-page-application"
            }
          }
          JSON

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.deploy.jsonc
