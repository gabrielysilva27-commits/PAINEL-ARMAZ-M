<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Financeiro">
<link rel="icon" href="https://ufopppghoaliuhsympjg.supabase.co/functions/v1/financeiro-app?asset=icon">
<link rel="apple-touch-icon" href="https://ufopppghoaliuhsympjg.supabase.co/functions/v1/financeiro-app?asset=icon">
<title>Meu Financeiro</title>
<style>
:root{--bg:#08101f;--panel:#111a2e;--panel2:#17223b;--text:#f6f8fc;--muted:#94a3b8;--line:#24324d;--accent:#6ee7b7;--danger:#fb7185;--income:#67e8f9}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#08101f,#0c1426 45%,#08101f);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.wrap{max-width:720px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
.auth{min-height:100vh;display:grid;place-items:center;padding:28px}.card{background:rgba(17,26,46,.94);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 60px #0007}.auth .card{width:min(100%,420px);padding:26px}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#6ee7b7,#22d3ee);color:#07111e;font-weight:900;font-size:20px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--accent);font-weight:800;margin:0 0 5px}.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:28px;line-height:1.08;margin:18px 0 8px}.stack{display:grid;gap:11px}.field{display:grid;gap:6px}.field span{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#0b1426;color:var(--text);border-radius:14px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#4ade80}.primary{border:0;background:linear-gradient(135deg,#6ee7b7,#22d3ee);color:#06101b;font-weight:900;border-radius:14px;padding:13px 16px}.ghost{border:1px solid var(--line);background:#0b1426;color:var(--text);border-radius:13px;padding:10px 12px}.danger{color:#fecdd3;border-color:#7f1d1d}.seg{display:grid;grid-template-columns:1fr 1fr;background:#0a1324;padding:4px;border-radius:14px;margin:15px 0}.seg button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:11px}.seg button.on{background:var(--panel2);color:var(--text);font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px;position:sticky;top:0;background:linear-gradient(#08101ff2,#08101fc8,#08101f00);backdrop-filter:blur(12px);z-index:3}.top h2{margin:0;font-size:22px}.top select{width:auto;padding:9px 10px}.row{display:flex;gap:9px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.metric{padding:15px;border-radius:19px;background:linear-gradient(145deg,#131e34,#0d1729);border:1px solid var(--line)}.metric b{display:block;font-size:20px;margin-top:5px}.positive{color:var(--accent)}.negative{color:#fda4af}.section{margin:18px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-head h3{margin:0;font-size:16px}.list{display:grid;gap:8px}.item{background:rgba(17,26,46,.82);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item .main{min-width:0}.item .title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:12px}.amount{font-weight:900;white-space:nowrap}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#192640;color:#b8c5d9;font-size:11px}.bar{height:8px;border-radius:99px;background:#0b1426;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6ee7b7,#22d3ee);border-radius:99px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#091220ef;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(6,1fr);z-index:8}.nav button{border:0;background:transparent;color:#8190a8;padding:7px 2px;font-size:10px}.nav button b{display:block;font-size:18px}.nav button.on{color:var(--accent)}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:calc(82px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#6ee7b7,#22d3ee);font-size:30px;color:#06101b;box-shadow:0 12px 30px #0008;z-index:9}
.sheet{position:fixed;inset:0;background:#020617aa;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet>div{width:min(720px,100%);max-height:88vh;overflow:auto;background:#101a2e;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h3{margin:0}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet .grid{grid-template-columns:1fr 1fr}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tabs button{white-space:nowrap}.chat{display:grid;gap:10px}.bubble{padding:12px 14px;border-radius:16px;max-width:88%}.bot{background:#17223b}.me{background:#153b35;margin-left:auto}.agentbox{display:flex;gap:8px;position:sticky;bottom:0;background:#08101f;padding-top:12px}.agentbox input{flex:1}.agentbox button{padding:0 16px}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.metric b{font-size:18px}.nav button span{display:none}.nav{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="card">
    <div class="logo">MF</div>
    <p class="eyebrow" style="margin-top:18px">AGENTE FINANCEIRO PESSOAL</p>
    <h1>Seu dinheiro, organizado de verdade.</h1>
    <p class="muted">Começamos com lançamentos manuais. As integrações automáticas entram na próxima etapa.</p>
    <div class="seg"><button id="loginTab" class="on">Entrar</button><button id="signupTab">Criar conta</button></div>
    <form id="authForm" class="stack">
      <label id="nameBox" class="field hidden"><span>Nome</span><input id="name" autocomplete="name"></label>
      <label class="field"><span>E-mail</span><input id="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Senha</span><input id="password" type="password" required minlength="6"></label>
      <button class="primary" type="submit" id="authBtn">Entrar</button>
      <small id="authMsg" class="muted"></small>
    </form>
  </div>
</div>

<div id="app" class="wrap hidden">
  <header class="top"><div><p class="eyebrow">MEU FINANCEIRO</p><h2 id="hello">Olá</h2></div><div class="row"><select id="month"></select><button id="logout" class="ghost">Sair</button></div></header>
  <main id="content"></main>
  <button id="fab" class="fab">+</button>
  <nav class="nav" id="nav">
    <button data-v="resumo" class="on"><b>⌂</b><span>Resumo</span></button>
    <button data-v="transacoes"><b>↕</b><span>Gastos</span></button>
    <button data-v="contas"><b>▣</b><span>Contas</span></button>
    <button data-v="cartoes"><b>▰</b><span>Cartões</span></button>
    <button data-v="metas"><b>◎</b><span>Metas</span></button>
    <button data-v="agente"><b>✦</b><span>Agente</span></button>
  </nav>
</div>
<div id="sheet" class="sheet hidden"><div><div class="sheet-head"><h3 id="sheetTitle">Novo lançamento</h3><button class="ghost" onclick="closeSheet()">×</button></div><div id="sheetBody"></div></div></div>

<script>
const BASE='https://ufopppghoaliuhsympjg.supabase.co';
const KEY='sb_publishable_7KVryz7s-zRBaeKGAGgG0g_7ULTRfuo';
const SKEY='mf_session_v2';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='login',view='resumo';
let state={session:JSON.parse(localStorage.getItem(SKEY)||'null'),profile:null,accounts:[],cards:[],categories:[],transactions:[],budgets:[],month:new Date().toISOString().slice(0,7)};

function saveSession(s){state.session=s;if(s)localStorage.setItem(SKEY,JSON.stringify(s));else localStorage.removeItem(SKEY)}
function bounds(k){let a=k.split('-').map(Number),y=a[0],m=a[1],ny=m===12?y+1:y,nm=m===12?1:m+1;return{start:y+'-'+String(m).padStart(2,'0')+'-01T00:00:00-03:00',end:ny+'-'+String(nm).padStart(2,'0')+'-01T00:00:00-03:00',period:y+'-'+String(m).padStart(2,'0')+'-01'}}
function labelMonth(k){let a=k.split('-').map(Number);return new Intl.DateTimeFormat('pt-BR',{month:'short',year:'2-digit'}).format(new Date(a[0],a[1]-1,1))}
async function refresh(){if(!state.session||!state.session.refresh_token)return false;let r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({refresh_token:state.session.refresh_token})});if(!r.ok){saveSession(null);return false}let d=await r.json();saveSession(Object.assign({},state.session,d,{user:d.user||state.session.user}));return true}
async function rest(path,opt,retry){opt=opt||{};if(retry===undefined)retry=true;let h=Object.assign({apikey:KEY,Authorization:'Bearer '+((state.session&&state.session.access_token)||''),'content-type':'application/json'},opt.headers||{});let r=await fetch(BASE+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(r.status===401&&retry&&await refresh())return rest(path,opt,false);if(!r.ok){let x={};try{x=await r.json()}catch(e){}throw Error(x.message||x.details||('Erro '+r.status))}let t=await r.text();return t?JSON.parse(t):null}
const db={sel:(t,q)=>rest(t+'?'+(q||'')),ins:(t,o)=>rest(t,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(o)}),del:(t,f)=>rest(t+'?'+f,{method:'DELETE',headers:{Prefer:'return=minimal'}}),upd:(t,f,o)=>rest(t+'?'+f,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(o)})};

async function signIn(e,p){let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email:e,password:p})});let d=await r.json();if(!r.ok)throw Error(d.error_description||d.message||'E-mail ou senha inválidos');saveSession(d)}
async function signUp(e,p,n){let r=await fetch(BASE+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email:e,password:p,data:{full_name:n}})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Não foi possível criar a conta');if(d.access_token)saveSession(d);return d}
async function validate(){if(!state.session||!state.session.access_token)return false;let r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+state.session.access_token}});if(r.ok){let u=await r.json();state.session.user=u;saveSession(state.session);return true}return await refresh()}
function setAuthMode(m){mode=m;$('#loginTab').classList.toggle('on',m==='login');$('#signupTab').classList.toggle('on',m==='signup');$('#nameBox').classList.toggle('hidden',m==='login');$('#authBtn').textContent=m==='login'?'Entrar':'Criar conta'}
$('#loginTab').onclick=()=>setAuthMode('login');$('#signupTab').onclick=()=>setAuthMode('signup');
$('#authForm').onsubmit=async e=>{e.preventDefault();$('#authBtn').disabled=true;$('#authMsg').textContent='';try{if(mode==='login')await signIn($('#email').value,$('#password').value);else{let d=await signUp($('#email').value,$('#password').value,$('#name').value);if(!d.access_token){$('#authMsg').textContent='Conta criada. Confirme o e-mail e depois entre.';return}}await start()}catch(x){$('#authMsg').textContent=x.message}finally{$('#authBtn').disabled=false}};
$('#logout').onclick=()=>{saveSession(null);location.reload()};

function initMonths(){let s=$('#month');s.innerHTML='';for(let i=-5;i<=1;i++){let d=new Date();d.setMonth(d.getMonth()+i);let k=d.toISOString().slice(0,7),o=document.createElement('option');o.value=k;o.textContent=labelMonth(k);if(k===state.month)o.selected=true;s.appendChild(o)}s.onchange=()=>{state.month=s.value;load()}}
async function load(){let b=bounds(state.month),uid=state.session.user.id;let out=await Promise.all([
 db.sel('profiles','id=eq.'+uid+'&select=*'),
 db.sel('accounts','active=eq.true&order=created_at.asc&select=*'),
 db.sel('cards','active=eq.true&order=created_at.asc&select=*'),
 db.sel('categories','active=eq.true&order=kind.asc,name.asc&select=*'),
 db.sel('transactions','occurred_at=gte.'+encodeURIComponent(b.start)+'&occurred_at=lt.'+encodeURIComponent(b.end)+'&order=occurred_at.desc&select=*'),
 db.sel('budgets','period_start=eq.'+b.period+'&select=*')
]);state.profile=out[0][0]||null;state.accounts=out[1];state.cards=out[2];state.categories=out[3];state.transactions=out[4];state.budgets=out[5];$('#hello').textContent='Olá'+(state.profile&&state.profile.full_name?', '+state.profile.full_name.split(' ')[0]:'');render()}
function catName(id){let c=state.categories.find(x=>x.id===id);return c?c.name:'Sem categoria'}
function accountName(id){let a=state.accounts.find(x=>x.id===id);return a?a.name:''}
function cardName(id){let a=state.cards.find(x=>x.id===id);return a?a.name:''}
function totals(){let exp=0,inc=0,card=0;state.transactions.forEach(t=>{if(t.status==='reversed')return;if(t.kind==='expense')exp+=+t.amount;if(t.kind==='income')inc+=+t.amount;if(t.card_id&&t.kind==='expense')card+=+t.amount});let saldo=state.accounts.reduce((s,a)=>s+Number(a.current_balance||0),0);return{exp,inc,card,saldo}}
function txItem(t){let source=t.card_id?cardName(t.card_id):accountName(t.account_id);return '<div class="item"><div class="main"><div class="title">'+esc(t.description)+'</div><div class="tiny muted">'+esc(catName(t.category_id))+(source?' · '+esc(source):'')+' · '+new Date(t.occurred_at).toLocaleDateString('pt-BR')+'</div></div><div class="amount '+(t.kind==='income'?'positive':'negative')+'">'+(t.kind==='income'?'+':'-')+money(t.amount)+'</div></div>'}
function renderResumo(){let t=totals();let cats={};state.transactions.filter(x=>x.kind==='expense').forEach(x=>cats[catName(x.category_id)]=(cats[catName(x.category_id)]||0)+Number(x.amount));let top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);return '<div class="grid"><div class="metric"><span class="muted tiny">Saldo em contas</span><b>'+money(t.saldo)+'</b></div><div class="metric"><span class="muted tiny">Gasto no mês</span><b class="negative">'+money(t.exp)+'</b></div><div class="metric"><span class="muted tiny">Receitas</span><b class="positive">'+money(t.inc)+'</b></div><div class="metric"><span class="muted tiny">Cartões no mês</span><b>'+money(t.card)+'</b></div></div><div class="section"><div class="section-head"><h3>Maiores gastos</h3></div>'+(top.length?'<div class="list">'+top.map(x=>'<div class="item"><div class="title">'+esc(x[0])+'</div><div class="amount">'+money(x[1])+'</div></div>').join('')+'</div>':'<div class="empty">Seus gastos aparecerão aqui.</div>')+'</div><div class="section"><div class="section-head"><h3>Últimos lançamentos</h3></div>'+(state.transactions.length?'<div class="list">'+state.transactions.slice(0,6).map(txItem).join('')+'</div>':'<div class="empty">Nenhum lançamento neste mês.</div>')+'</div>'}
function renderTransactions(){return '<div class="section"><div class="section-head"><h3>Transações</h3><span class="pill">'+state.transactions.length+' lançamentos</span></div>'+(state.transactions.length?'<div class="list">'+state.transactions.map(txItem).join('')+'</div>':'<div class="empty">Nenhuma transação neste mês.</div>')+'</div>'}
function renderAccounts(){return '<div class="section"><div class="section-head"><h3>Contas</h3><button class="ghost" onclick="openAccount()">+ Conta</button></div>'+(state.accounts.length?'<div class="list">'+state.accounts.map(a=>'<div class="item"><div><div class="title">'+esc(a.name)+'</div><div class="tiny muted">'+esc(a.institution||a.account_type)+'</div></div><div class="amount">'+money(a.current_balance)+'</div></div>').join('')+'</div>':'<div class="empty">Cadastre sua primeira conta.</div>')+'</div>'}
function renderCards(){return '<div class="section"><div class="section-head"><h3>Cartões</h3><button class="ghost" onclick="openCard()">+ Cartão</button></div>'+(state.cards.length?'<div class="list">'+state.cards.map(c=>{let used=state.transactions.filter(t=>t.card_id===c.id&&t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0);let lim=Number(c.limit_amount||0),pct=lim?Math.min(100,used/lim*100):0;return '<div class="card"><div class="section-head"><div><div class="title">'+esc(c.name)+'</div><div class="tiny muted">'+esc(c.institution||'')+(c.last4?' · •••• '+c.last4:'')+'</div></div><div class="amount">'+money(used)+'</div></div><div class="tiny muted">'+(lim?'Limite '+money(lim):'Limite não informado')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'}).join('')+'</div>':'<div class="empty">Cadastre seu primeiro cartão.</div>')+'</div>'}
function renderBudgets(){let expenses={};state.transactions.filter(t=>t.kind==='expense').forEach(t=>expenses[t.category_id]=(expenses[t.category_id]||0)+Number(t.amount));return '<div class="section"><div class="section-head"><h3>Orçamentos do mês</h3><button class="ghost" onclick="openBudget()">+ Meta</button></div>'+(state.budgets.length?'<div class="list">'+state.budgets.map(b=>{let used=expenses[b.category_id]||0,pct=b.limit_amount?Math.min(100,used/b.limit_amount*100):0;return '<div class="card"><div class="section-head"><div class="title">'+esc(catName(b.category_id))+'</div><div class="amount">'+money(used)+' / '+money(b.limit_amount)+'</div></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'}).join('')+'</div>':'<div class="empty">Defina limites por categoria para acompanhar seu orçamento.</div>')+'</div>'}
let chat=['Posso analisar seus próprios lançamentos. Pergunte: “onde gastei mais?”, “quanto está o cartão?” ou “posso gastar 500 reais?”'];
function agentAnswer(q){let t=totals(),s=q.toLowerCase(),num=Number((s.match(/\d+[\d.,]*/)||['0'])[0].replace(/\./g,'').replace(',','.'));if(s.includes('cart'))return 'Você lançou '+money(t.card)+' em cartões neste mês.';if(s.includes('posso')||s.includes('gastar')){let free=t.saldo-t.card;return 'Seu saldo em contas é '+money(t.saldo)+'. Considerando '+money(t.card)+' lançado em cartões, a folga simples é '+money(free)+'. '+(num?('Depois de '+money(num)+', ficaria em aproximadamente '+money(free-num)+'.'):'')};let cats={};state.transactions.filter(x=>x.kind==='expense').forEach(x=>cats[catName(x.category_id)]=(cats[catName(x.category_id)]||0)+Number(x.amount));let top=Object.entries(cats).sort((a,b)=>b[1]-a[1]);if(s.includes('mais')||s.includes('onde'))return top.length?'Sua maior categoria é '+top[0][0]+', com '+money(top[0][1])+'.':'Ainda não há despesas neste mês.';for(let x of top){if(s.includes(x[0].toLowerCase()))return 'Você gastou '+money(x[1])+' com '+x[0]+' neste mês.'}return 'Neste mês você recebeu '+money(t.inc)+' e gastou '+money(t.exp)+'. Posso detalhar por categoria ou cartão.'}
function renderAgent(){return '<div class="section"><div class="section-head"><h3>Agente financeiro</h3><span class="pill">dados privados</span></div><div class="chat" id="chat">'+chat.map((x,i)=>'<div class="bubble '+(i%2?'me':'bot')+'">'+esc(x)+'</div>').join('')+'</div><form class="agentbox" id="agentForm"><input id="agentInput" placeholder="Pergunte sobre seus gastos"><button class="primary">Enviar</button></form></div>'}
function render(){let c=$('#content');c.innerHTML=view==='resumo'?renderResumo():view==='transacoes'?renderTransactions():view==='contas'?renderAccounts():view==='cartoes'?renderCards():view==='metas'?renderBudgets():renderAgent();if(view==='agente')$('#agentForm').onsubmit=e=>{e.preventDefault();let q=$('#agentInput').value.trim();if(!q)return;chat.push(q);chat.push(agentAnswer(q));render()};$('#fab').classList.toggle('hidden',view==='agente')}
$('#nav').onclick=e=>{let b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render()};
$('#fab').onclick=()=>openTransaction();

function openSheet(title,body){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#sheet').classList.remove('hidden')}
function closeSheet(){$('#sheet').classList.add('hidden')}window.closeSheet=closeSheet;
window.openTransaction=function(){let opts=state.categories.map(c=>'<option value="'+c.id+'" data-kind="'+c.kind+'">'+esc(c.name)+'</option>').join(''),acc='<option value="">Nenhuma</option>'+state.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join(''),cards='<option value="">Nenhum</option>'+state.cards.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('');openSheet('Novo lançamento','<form id="txForm" class="stack"><div class="tabs"><button type="button" class="ghost on" data-k="expense">Despesa</button><button type="button" class="ghost" data-k="income">Receita</button></div><input type="hidden" id="txKind" value="expense"><label class="field"><span>Descrição</span><input id="txDesc" required placeholder="Ex.: Mercado"></label><label class="field"><span>Valor</span><input id="txValue" type="number" step="0.01" min="0.01" required></label><div class="grid"><label class="field"><span>Categoria</span><select id="txCat">'+opts+'</select></label><label class="field"><span>Data</span><input id="txDate" type="datetime-local" required></label></div><div class="grid"><label class="field"><span>Conta</span><select id="txAcc">'+acc+'</select></label><label class="field"><span>Cartão</span><select id="txCard">'+cards+'</select></label></div><button class="primary">Salvar</button></form>');let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#txDate').value=d.toISOString().slice(0,16);let choose=()=>{let k=$('#txKind').value;Array.from($('#txCat').options).forEach(o=>o.hidden=o.dataset.kind!==k);let first=Array.from($('#txCat').options).find(o=>!o.hidden);if(first)$('#txCat').value=first.value};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{$('#txKind').value=b.dataset.k;document.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x===b));choose()});choose();$('#txAcc').onchange=()=>{if($('#txAcc').value)$('#txCard').value=''};$('#txCard').onchange=()=>{if($('#txCard').value)$('#txAcc').value=''};$('#txForm').onsubmit=async e=>{e.preventDefault();try{await db.ins('transactions',{user_id:state.session.user.id,kind:$('#txKind').value,amount:Number($('#txValue').value),occurred_at:new Date($('#txDate').value).toISOString(),description:$('#txDesc').value.trim(),category_id:$('#txCat').value||null,account_id:$('#txAcc').value||null,card_id:$('#txCard').value||null,source:'manual',status:'posted'});closeSheet();await load()}catch(x){alert(x.message)}}};
window.openAccount=function(){openSheet('Adicionar conta','<form id="aForm" class="stack"><label class="field"><span>Nome</span><input id="aName" required placeholder="Ex.: Nubank"></label><label class="field"><span>Instituição</span><input id="aInst"></label><div class="grid"><label class="field"><span>Tipo</span><select id="aType"><option value="checking">Conta corrente</option><option value="savings">Poupança</option><option value="wallet">Carteira</option><option value="cash">Dinheiro</option><option value="investment">Investimentos</option><option value="other">Outro</option></select></label><label class="field"><span>Saldo atual</span><input id="aBal" type="number" step="0.01" value="0"></label></div><button class="primary">Salvar</button></form>');$('#aForm').onsubmit=async e=>{e.preventDefault();try{await db.ins('accounts',{user_id:state.session.user.id,name:$('#aName').value.trim(),institution:$('#aInst').value.trim()||null,account_type:$('#aType').value,current_balance:Number($('#aBal').value||0),source:'manual'});closeSheet();await load()}catch(x){alert(x.message)}}};
window.openCard=function(){let acc='<option value="">Nenhuma</option>'+state.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('');openSheet('Adicionar cartão','<form id="cForm" class="stack"><label class="field"><span>Nome</span><input id="cName" required></label><label class="field"><span>Instituição</span><input id="cInst"></label><div class="grid"><label class="field"><span>Limite</span><input id="cLimit" type="number" step="0.01"></label><label class="field"><span>Últimos 4 dígitos</span><input id="cLast" maxlength="4"></label></div><div class="grid"><label class="field"><span>Fecha dia</span><input id="cClose" type="number" min="1" max="31"></label><label class="field"><span>Vence dia</span><input id="cDue" type="number" min="1" max="31"></label></div><label class="field"><span>Conta de pagamento</span><select id="cAcc">'+acc+'</select></label><button class="primary">Salvar</button></form>');$('#cForm').onsubmit=async e=>{e.preventDefault();try{await db.ins('cards',{user_id:state.session.user.id,name:$('#cName').value.trim(),institution:$('#cInst').value.trim()||null,limit_amount:$('#cLimit').value?Number($('#cLimit').value):null,last4:$('#cLast').value||null,closing_day:$('#cClose').value?Number($('#cClose').value):null,due_day:$('#cDue').value?Number($('#cDue').value):null,account_id:$('#cAcc').value||null,source:'manual'});closeSheet();await load()}catch(x){alert(x.message)}}};
window.openBudget=function(){let cats=state.categories.filter(c=>c.kind==='expense').map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');openSheet('Definir orçamento','<form id="bForm" class="stack"><label class="field"><span>Categoria</span><select id="bCat">'+cats+'</select></label><label class="field"><span>Limite mensal</span><input id="bLim" type="number" step="0.01" min="0" required></label><button class="primary">Salvar</button></form>');$('#bForm').onsubmit=async e=>{e.preventDefault();let p=bounds(state.month).period,c=$('#bCat').value,l=Number($('#bLim').value),old=state.budgets.find(x=>x.category_id===c);try{if(old)await db.upd('budgets','id=eq.'+old.id,{limit_amount:l,updated_at:new Date().toISOString()});else await db.ins('budgets',{user_id:state.session.user.id,category_id:c,period_start:p,limit_amount:l});closeSheet();await load()}catch(x){alert(x.message)}}};

async function start(){if(!await validate()){return}$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');initMonths();await load()}
start().catch(e=>{console.error(e);saveSession(null)});
</script>
</body></html>
