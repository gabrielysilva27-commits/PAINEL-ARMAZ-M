<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pediforme Automático</title>
<style>
:root{--ink:#111;--muted:#5b6470;--panel:#fff;--bg:#eef1f5;--accent:#1457d9;--border:#d6dbe3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:#15171a}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:16px 22px;display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(145px,175px) minmax(180px,1.2fr) auto auto;gap:10px;align-items:end;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.toolbar .brand{font-size:17px;font-weight:700;line-height:1.2;align-self:center}
.control{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#596474;min-width:0}
.control select,.control input{width:100%;min-width:0;height:40px}
button,.file-btn,select,input[type=date]{font:inherit;border:1px solid #c9ced8;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}
.toolbar button,.toolbar .file-btn{height:40px;white-space:nowrap;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.toolbar select,.toolbar input[type=date]{font-size:13px}
.toolbar .file-btn{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary,.file-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled,select:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:none}
.status{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.3}
.help{max-width:860px;margin:12px auto 0;padding:0 16px;color:var(--muted);font-size:12px}
.help summary{cursor:pointer;width:max-content}
.help p{margin:7px 0 0}
.dropzone{max-width:860px;margin:18px auto;padding:32px 24px;border:2px dashed #b8c5d7;border-radius:12px;background:#fff;text-align:center;transition:.15s;color:var(--muted);font-size:14px}
.dropzone.drag{border-color:var(--accent);background:#f5f8ff}
.dropzone strong{display:block;font-size:16px;margin-bottom:6px;color:#252a33}
.pages{padding:18px 0 40px}
.notice{max-width:860px;margin:0 auto 16px;padding:12px 15px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:13px;color:#4d5664;display:none}

/* FORMULÁRIO: coordenadas em milímetros reproduzidas do Word original */
.sheet-page{width:210mm;height:297mm;margin:0 auto 18px;background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.13);position:relative;overflow:hidden;font-family:"Times New Roman",Times,serif;color:#000;font-size:12pt;font-weight:400;line-height:1}
.sheet-page *{font-family:"Times New Roman",Times,serif;font-weight:400}
.header-image{position:absolute;left:28.80mm;top:10.00mm;width:152.40mm;height:29.37mm;object-fit:fill;margin:0}
.toprow{position:static;margin:0;padding:0}
.toprow>div:first-child{position:absolute;left:17.52mm;top:57.24mm;width:22.36mm;height:21.87mm}
.toprow>div:first-child img{display:block!important;width:22.36mm!important;height:21.87mm!important;object-fit:fill!important}
.date{position:absolute;top:78.73mm;right:10.00mm;white-space:nowrap;font-size:12pt;line-height:1}
.code{position:absolute;left:18.65mm;top:98.08mm;margin:0;font-size:12pt;line-height:1}
.title{position:absolute;left:17.52mm;right:10.00mm;top:107.75mm;margin:0;text-align:center;text-decoration:underline;text-underline-offset:1px;font-size:12pt;line-height:1;font-weight:400}
.info-grid{position:static;display:block;margin:0;padding:0;font-size:12pt}
.info-grid>div{position:absolute;line-height:1;min-height:0;font-weight:400}
.info-grid .info-label:nth-of-type(1){left:17.52mm;top:117.73mm}
.info-grid .info-value:nth-of-type(2){left:67.70mm;top:117.73mm}
.info-grid .info-label:nth-of-type(3){left:17.52mm;top:127.27mm}
.info-grid .info-value:nth-of-type(4){left:67.70mm;top:127.27mm}
.info-grid .info-label:nth-of-type(5){left:17.52mm;top:137.04mm}
/* No Word original, o conteúdo do motorista cai na linha imediatamente abaixo do rótulo. */
.info-grid .info-value:nth-of-type(6){left:17.52mm;top:142.04mm;right:10mm;white-space:nowrap}
.info-grid .info-label:nth-of-type(7){left:17.52mm;top:151.64mm}
.info-grid .info-value:nth-of-type(8){left:67.70mm;top:151.64mm}

.products{position:absolute;left:21.00mm;top:171.08mm;width:171.00mm;border-collapse:collapse;table-layout:fixed;margin:0;font-size:12pt;line-height:1}
.products th,.products td{border:0;padding:0;margin:0;font-size:12pt;font-weight:400;line-height:1;text-align:center;vertical-align:top;white-space:nowrap}
.products th{height:4.87mm}
.products th:nth-child(1),.products td:nth-child(1){width:115.00mm}
.products th:nth-child(2),.products td:nth-child(2){width:25.00mm}
.products th:nth-child(3),.products td:nth-child(3){width:31.00mm}
.products tbody tr{height:4.87mm}
.products tbody td{height:4.87mm}

.bottom{position:absolute;left:17.52mm;right:10.00mm;top:244.13mm;margin:0;font-size:12pt;line-height:1}
.bottom-row{display:grid;grid-template-columns:25.10mm 1fr;height:4.66mm;margin:0;line-height:1;align-items:start}
.bottom-row>div{font-weight:400;white-space:nowrap}
.obs{display:flex;align-items:flex-start;height:5.1mm;margin:0;line-height:1}
.obs span:first-child{margin-right:0}
.obs-line{border:0;border-bottom:1px solid #333;flex:none;width:137.20mm;height:3.55mm;margin-left:.3mm}
.order{position:absolute;left:0;right:0;top:19.15mm;margin:0;text-align:center;font-size:12pt;font-weight:400;line-height:1}
.empty{color:#999}

@media print{
 @page{size:A4 portrait;margin:0}
 html,body{width:210mm;margin:0;padding:0;background:#fff}
 .toolbar,.help,.dropzone,.notice{display:none!important}
 .pages{padding:0;margin:0}
 .sheet-page{margin:0;box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .sheet-page:last-child{page-break-after:auto;break-after:auto}
 body.print-single .sheet-page{display:none}
 body.print-single .sheet-page.print-target{display:block}
}
@media(max-width:1250px){.toolbar{grid-template-columns:1fr auto minmax(145px,175px) minmax(170px,1fr)}.toolbar button{grid-row:2}.status{grid-row:3}}
@media(max-width:680px){.toolbar{position:static;grid-template-columns:1fr 1fr;padding:14px}.brand,.status,.order-control{grid-column:1/-1}.toolbar .file-btn,.toolbar button{width:100%}.date-control{grid-column:1/-1}.status{grid-row:auto}.sheet-page{transform-origin:top center}}
</style>
</head>
<body>
<div class="toolbar">
  <span class="brand">Pediforme Automático</span>
  <label class="file-btn primary" for="fileInput">Selecionar planilha</label>
  <input id="fileInput" type="file" accept=".xlsx,.xlsm">
  <label class="control date-control" for="documentDate">Data do documento <input id="documentDate" type="date" required></label>
  <label class="control order-control" for="pedidoSelect">Pedido <select id="pedidoSelect" disabled><option>Selecione um pedido</option></select></label>
  <button id="printOne" disabled>Imprimir selecionado</button>
  <button id="printAll" class="primary" disabled>Imprimir todos</button>
  <span id="status" class="status">Nenhuma planilha carregada</span>
</div>
<details class="help"><summary>Orientações de impressão</summary><p>Use <b>Pediforme - Não apagar.xlsx</b>. Para manter a escala do Word: A4, escala 100%, margens nenhuma e cabeçalhos/rodapés desativados.</p></details>
<div id="notice" class="notice"></div>
<div id="dropzone" class="dropzone">
  <strong>Arraste a planilha aqui</strong>
  ou use “Selecionar planilha”.
</div>
<main id="pages" class="pages"></main>

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clean(v){if(v===null||v===undefined)return ''; let s=String(v).trim(); if(/^[-+]?\d+\.0+$/.test(s)) s=s.replace(/\.0+$/,''); return s;}
function todayISO(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=type=>parts.find(x=>x.type===type).value;return get('year')+'-'+get('month')+'-'+get('day');}
function documentDateBR(){const value=documentDate.value;const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);return match?match[3]+'/'+match[2]+'/'+match[1]:'';}
documentDate.value=todayISO();
function colIndex(a1){const m=/^([A-Z]+)\d+$/i.exec(a1||''); if(!m)return -1; let n=0; for(const ch of m[1].toUpperCase()) n=n*26+ch.charCodeAt(0)-64; return n-1;}

class MiniZip{
 constructor(buf){this.buf=buf;this.dv=new DataView(buf);this.u8=new Uint8Array(buf);this.entries=new Map();this._readDirectory();}
 _u16(o){return this.dv.getUint16(o,true)} _u32(o){return this.dv.getUint32(o,true)}
 _readDirectory(){let e=-1, start=Math.max(0,this.u8.length-65557); for(let i=this.u8.length-22;i>=start;i--){if(this._u32(i)===0x06054b50){e=i;break;}} if(e<0)throw new Error('Arquivo XLSX inválido (ZIP não reconhecido).');
  const total=this._u16(e+10), cd=this._u32(e+16); let p=cd; const td=new TextDecoder('utf-8');
  for(let k=0;k<total;k++){if(this._u32(p)!==0x02014b50)throw new Error('Estrutura ZIP inválida.'); const method=this._u16(p+10), csize=this._u32(p+20), usize=this._u32(p+24), nlen=this._u16(p+28), xlen=this._u16(p+30), clen=this._u16(p+32), local=this._u32(p+42); const name=td.decode(this.u8.slice(p+46,p+46+nlen)); this.entries.set(name,{method,csize,usize,local}); p+=46+nlen+xlen+clen;}

function normalizePath(base,target){if(target.startsWith('/'))return target.replace(/^\//,''); const parts=(base+'/'+target).split('/'), out=[]; for(const p of parts){if(!p||p==='.')continue; if(p==='..')out.pop(); else out.push(p);} return out.join('/');}

async function readXlsx(file){
 const zip=new MiniZip(await file.arrayBuffer());
 let shared=[];
 if(zip.entries.has('xl/sharedStrings.xml')){
  const d=xml(await zip.text('xl/sharedStrings.xml'));
  shared=elementsByLocal(d,'si').map(si=>elementsByLocal(si,'t').map(t=>t.textContent).join(''));
 }
 const wb=xml(await zip.text('xl/workbook.xml'));
 const sheets=elementsByLocal(wb,'sheet');
 let sh=sheets.find(x=>(x.getAttribute('name')||'').trim().toLowerCase()==='pediforme')||sheets[0];
 if(!sh)throw new Error('Nenhuma aba encontrada na planilha.');
 const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
 const rel=xml(await zip.text('xl/_rels/workbook.xml.rels'));
 const relation=elementsByLocal(rel,'Relationship').find(x=>x.getAttribute('Id')===rid);
 if(!relation)throw new Error('Não foi possível localizar a aba Pediforme.');
 const sheetPath=normalizePath('xl',relation.getAttribute('Target'));
 const sd=xml(await zip.text(sheetPath));
 const rows=[];
 for(const r of elementsByLocal(sd,'row')){
   const ri=(parseInt(r.getAttribute('r')||'0',10)||0)-1; if(ri<0)continue; const arr=[];
   for(const c of elementsByLocal(r,'c')){
     const ci=colIndex(c.getAttribute('r')); if(ci<0)continue; const t=c.getAttribute('t')||''; let val='';
     if(t==='inlineStr'){val=elementsByLocal(c,'t').map(x=>x.textContent).join('');}
     else {const v=elementsByLocal(c,'v')[0]?.textContent??''; if(t==='s') val=shared[Number(v)]??''; else if(t==='b') val=v==='1'?'TRUE':'FALSE'; else val=v;}
     arr[ci]=val;
   }
   rows[ri]=arr;
 }
 const header=(rows[0]||[]).map(clean); const map=new Map(); header.forEach((h,i)=>{if(h)map.set(h.toUpperCase(),i)});
 const need=['ÚNICO','MOTORISTA','PLACA','NPEDIDO','DESTINO','ENDERECO']; for(const n of need){if(!map.has(n))throw new Error('Coluna obrigatória não encontrada: '+n);}
 const get=(row,k)=>clean(row[map.get(k)]);
 const out=[];
 for(let i=1;i<rows.length;i++){
   const row=rows[i]||[]; if(!get(row,'ÚNICO'))continue;
   const o={unico:get(row,'ÚNICO'), motorista:get(row,'MOTORISTA'), placa:get(row,'PLACA'), npedido:get(row,'NPEDIDO'), destino:get(row,'DESTINO'), endereco:get(row,'ENDERECO'), produtos:[]};
   for(let n=1;n<=10;n++){const nn=String(n).padStart(2,'0'); const p=get(row,'PROD'+nn), u=get(row,'UND'+nn), q=get(row,'QUANT'+nn); o.produtos.push({p,u,q});}
   out.push(o);
 }
 return out;
}

 return `<section class="sheet-page" data-index="${i}">
   <img class="header-image" src="${HEADER_LOGO}" alt="Império">
   <div class="toprow"><div><img src="${SKOL_LOGO}" alt="Skol"></div><div class="date">DATA: ${documentDateBR()}</div></div>
   <div class="code">CÓDIGO DA REVENDA – 141003</div>
   <div class="title">PEDIDO DE FORNECIMENTO DE PRODUTOS</div>
   <div class="info-grid">
    <div class="info-label">Transportador</div><div class="info-value">IMPÉRIO SOC. COM. DE BEBIDAS LTDA</div>
    <div class="info-label">Endereço</div><div class="info-value">ESTRADA DO SANTANA, 292 – VILA SÃO LUIZ.</div>
    <div class="info-label">Nome do Motorista</div><div class="info-value">${esc(r.motorista)}</div>
    <div class="info-label">Carro Placa</div><div class="info-value">${esc(r.placa)}</div>
   </div>
   <table class="products"><thead><tr><th>DESCRIÇÃO DO PRODUTO</th><th>UNID.</th><th>QUANTID.</th></tr></thead><tbody>${trs}</tbody></table>
   <div class="bottom">
    <div class="bottom-row"><div>Destino:</div><div>${esc(r.destino)}</div></div>
    <div class="bottom-row"><div>Endereço:</div><div>${esc(r.endereco)}</div></div>
    <div class="obs"><span>Observações:</span><span class="obs-line"></span></div>
    <div class="order">Nº Pedido: ${esc(r.npedido)}</div>
   </div>
 </section>`;
}

function render(){
 pagesEl.innerHTML=registros.map(pageHtml).join(''); pedidoSelect.innerHTML='<option value="">Selecione um pedido</option>'+registros.map((r,i)=>`<option value="${i}">${esc(r.unico)} — Pedido ${esc(r.npedido)} — ${esc(r.motorista)}</option>`).join('');
 pedidoSelect.disabled=!registros.length; printAll.disabled=!registros.length; printOne.disabled=true; dropzone.style.display=registros.length?'none':'block';
}
async function loadFile(file){
 if(!file)return; statusEl.textContent='Lendo '+file.name+'…'; notice.style.display='none'; try{registros=await readXlsx(file); render(); if(!registros.length)throw new Error('Nenhum pedido com a coluna ÚNICO preenchida foi encontrado.'); statusEl.textContent=`${registros.length} pedido(s) carregado(s) — ${file.name}`; notice.textContent='Planilha carregada. Confira a prévia e use Imprimir todos ou escolha um pedido específico.'; notice.style.display='block';}
 catch(e){registros=[];render();statusEl.textContent='Erro ao carregar';notice.textContent=e.message||String(e);notice.style.display='block';console.error(e);}
}
documentDate.addEventListener('change',()=>{if(!documentDate.value)documentDate.value=todayISO();for(const date of pagesEl.querySelectorAll('.date'))date.textContent='DATA: '+documentDateBR();});
fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));
pedidoSelect.addEventListener('change',()=>printOne.disabled=pedidoSelect.value==='');
printAll.addEventListener('click',()=>{document.body.classList.remove('print-single'); document.querySelectorAll('.print-target').forEach(x=>x.classList.remove('print-target')); window.print();});
printOne.addEventListener('click',()=>{const i=Number(pedidoSelect.value); document.querySelectorAll('.print-target').forEach(x=>x.classList.remove('print-target')); const p=document.querySelector(`.sheet-page[data-index="${i}"]`); if(!p)return; p.classList.add('print-target'); document.body.classList.add('print-single'); window.print();});
window.addEventListener('afterprint',()=>{document.body.classList.remove('print-single');document.querySelectorAll('.print-target').forEach(x=>x.classList.remove('print-target'));});
['dragenter','dragover'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('drag')}));
dropzone.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
</script>
</body></html>
