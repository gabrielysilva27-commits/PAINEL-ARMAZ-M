<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placas do Picking | Império</title><link rel="stylesheet" href="styles.css?v=20261110-1"></head>
<body><header><a href="../">← Portal do Conferente</a><h1>Placas do Picking</h1><p>Uma placa por folha A4, sempre em paisagem.</p><div id="identity" hidden><span id="userName"></span> <button id="logout" type="button">Sair</button></div></header>
<main><section id="loginView"><form id="loginForm"><h2>Acesso do conferente</h2><label>Usuário<select id="conferencerSelect" required><option value="">Carregando…</option></select></label><label>PIN<input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 dígitos" required></label><button id="loginButton">Entrar</button></form></section>
<section id="workView" hidden><form id="productForm"><label>Código do produto<input id="codeInput" inputmode="numeric" pattern="[0-9]{1,12}" maxlength="12" placeholder="Ex.: 9084" required></label><button id="searchButton">Buscar produto</button><button id="printButton" type="button" disabled>Imprimir A4 paisagem</button></form><p id="source"></p><p class="hint">Confira a descrição antes de imprimir. Na impressão, use escala 100%, papel A4 e desative cabeçalhos e rodapés.</p><div id="preview" hidden><article id="sign"><div id="sku"><span id="skuText"></span></div><div id="description"><div id="name"></div><div id="details"></div><div id="size"></div></div></article></div><details id="originalWrap" hidden><summary>Descrição original da OCP</summary><p id="original"></p></details></section><p id="message" role="status" aria-live="polite"></p></main>
<script type="module" src="app.js?v=20261110-1"></script><script src="../../portal-pin.js?v=20261110-1" defer></script></body></html>
